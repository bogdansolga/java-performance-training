<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- title strip -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a1a1a">The GC time a Java profiler cannot see</text>
  <text x="40" y="64" font-size="13" fill="#5e6680">A native profile counts CPU time inside the JVM itself, not just inside application bytecode.</text>

  <!-- outer container -->
  <rect x="40" y="88" width="1200" height="560" rx="16" fill="#cfe2f3" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ===== LEFT: Native profile (full picture) ===== -->
  <rect x="90" y="126" width="530" height="290" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="90" y="126" width="530" height="54" rx="14" fill="#d5f5e3"/>
  <rect x="90" y="166" width="530" height="14" fill="#d5f5e3"/>
  <text x="355" y="159" font-size="18" font-weight="700" fill="#0e6655" text-anchor="middle">Native profile - the full 25.1s</text>

  <text x="120" y="212" font-size="14" fill="#1a1a1a">GC threads</text>
  <rect x="300" y="198" width="240" height="18" rx="4" fill="#4a235a"/>
  <text x="556" y="212" font-size="13" fill="#5e6680">13.0s</text>

  <text x="120" y="248" font-size="14" fill="#1a1a1a">JIT compiler threads</text>
  <rect x="300" y="234" width="131" height="18" rx="4" fill="#4a235a" fill-opacity="0.7"/>
  <text x="556" y="248" font-size="13" fill="#5e6680">7.1s</text>

  <text x="120" y="284" font-size="14" fill="#1a1a1a">Application code</text>
  <rect x="300" y="270" width="92" height="18" rx="4" fill="#0e6655"/>
  <text x="556" y="284" font-size="13" fill="#5e6680">5.0s</text>

  <text x="120" y="368" font-size="13" font-weight="700" fill="#0e6655">Total measured: 25.1s of real CPU time</text>
  <text x="120" y="390" font-size="13" fill="#5e6680">GC and JIT compiler threads run entirely inside the JVM.</text>

  <!-- ===== RIGHT: Java-level profiler (what it can see) ===== -->
  <rect x="660" y="126" width="530" height="290" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="660" y="126" width="530" height="54" rx="14" fill="#fdebd0"/>
  <rect x="660" y="166" width="530" height="14" fill="#fdebd0"/>
  <text x="925" y="159" font-size="18" font-weight="700" fill="#7e5109" text-anchor="middle">Java-level profiler - what it can see</text>

  <text x="690" y="212" font-size="14" fill="#1a1a1a">Application code</text>
  <rect x="880" y="198" width="92" height="18" rx="4" fill="#0e6655"/>
  <text x="1066" y="212" font-size="13" fill="#5e6680">5.0s</text>

  <text x="690" y="248" font-size="14" fill="#8a8f9e">GC threads</text>
  <text x="880" y="248" font-size="13" fill="#8a8f9e" font-style="italic">invisible - outside bytecode</text>

  <text x="690" y="284" font-size="14" fill="#8a8f9e">JIT compiler threads</text>
  <text x="880" y="284" font-size="13" fill="#8a8f9e" font-style="italic">invisible - outside bytecode</text>

  <text x="690" y="368" font-size="13" font-weight="700" fill="#7e5109">Reported total: 5.0s - 20% of the real 25.1s</text>
  <text x="690" y="390" font-size="13" fill="#5e6680">The other 80% never appears in the flame graph.</text>

  <!-- ===== Bottom: the blind spot ===== -->
  <rect x="90" y="446" width="1100" height="150" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="482" font-size="16" font-weight="700" fill="#1a1a1a">The blind spot is not only GC and JIT</text>
  <text x="120" y="512" font-size="14" fill="#5e6680">inflateBytes() - JAR decompression during class loading shows up in the native profile, and nowhere else.</text>
  <text x="120" y="540" font-size="14" fill="#5e6680">A Java-level profiler reports only the application slice - the rest needs a native or OS-level tool.</text>
  <text x="120" y="574" font-size="14" fill="#5e6680">A flat Java profile does not mean the JVM is idle - check the native profile before concluding that.</text>

  <!-- footer -->
  <text x="640" y="680" font-size="13" fill="#1a1a1a" text-anchor="middle">About 20 of 25.1 seconds of CPU time never touches application bytecode - a Java profiler cannot show you where it went.</text>

</svg>
