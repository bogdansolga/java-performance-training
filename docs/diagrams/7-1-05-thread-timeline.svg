<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- background -->
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- title strip -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1a1a1a">Blocking methods &amp; thread timelines</text>
  <text x="40" y="64" font-size="13" fill="#5e6680">Execution time can be dominated by park() and parkNanos() - waiting, not working.</text>

  <!-- outer container -->
  <rect x="40" y="88" width="1200" height="560" rx="16" fill="#cfe2f3" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ===== Thread timeline panel ===== -->
  <rect x="90" y="130" width="1100" height="300" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="166" font-size="16" font-weight="700" fill="#1a1a1a">Thread timeline - CPU work vs parked</text>

  <!-- legend -->
  <rect x="850" y="150" width="18" height="14" rx="3" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <text x="874" y="161" font-size="12" fill="#5e6680">Running (CPU)</text>
  <rect x="1010" y="150" width="18" height="14" rx="3" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1034" y="161" font-size="12" fill="#5e6680">Parked (no CPU)</text>

  <!-- Thread-1 -->
  <text x="130" y="211" font-size="13" font-weight="700" fill="#1a1a1a">Thread-1</text>
  <rect x="240" y="190" width="730" height="32" rx="5" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <text x="605" y="211" font-size="13" fill="#0e6655" text-anchor="middle">RUNNING - CPU-bound</text>
  <rect x="970" y="190" width="180" height="32" rx="5" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1060" y="211" font-size="13" fill="#5e6680" text-anchor="middle">parked</text>

  <!-- Thread-2 -->
  <text x="130" y="253" font-size="13" font-weight="700" fill="#1a1a1a">Thread-2</text>
  <rect x="240" y="232" width="450" height="32" rx="5" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <text x="465" y="253" font-size="13" fill="#0e6655" text-anchor="middle">RUNNING</text>
  <rect x="690" y="232" width="460" height="32" rx="5" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="920" y="253" font-size="13" fill="#5e6680" text-anchor="middle">parked</text>

  <!-- Thread-3 (the 632s callout) -->
  <text x="130" y="295" font-size="13" font-weight="700" fill="#1a1a1a">Thread-3</text>
  <rect x="240" y="274" width="80" height="32" rx="5" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="320" y="274" width="830" height="32" rx="5" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="735" y="295" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">632s in parkNanos() - not executing, waiting</text>

  <!-- Thread-4 -->
  <text x="130" y="337" font-size="13" font-weight="700" fill="#1a1a1a">Thread-4</text>
  <rect x="240" y="316" width="50" height="32" rx="5" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="290" y="316" width="860" height="32" rx="5" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="720" y="337" font-size="13" fill="#5e6680" text-anchor="middle">parked</text>

  <!-- Thread-5 -->
  <text x="130" y="379" font-size="13" font-weight="700" fill="#1a1a1a">Thread-5</text>
  <rect x="240" y="358" width="30" height="32" rx="5" fill="#d5f5e3" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="270" y="358" width="880" height="32" rx="5" fill="#e3e7ee" stroke="#1a1a1a" stroke-width="1"/>
  <text x="710" y="379" font-size="13" fill="#5e6680" text-anchor="middle">parked</text>

  <text x="120" y="412" font-size="12" fill="#5e6680">Thread-1 and Thread-2 do real CPU work; Thread-3-5 are pool threads waiting for servlet requests - normal at startup.</text>

  <!-- ===== Diagnostic panel ===== -->
  <rect x="90" y="450" width="1100" height="170" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="486" font-size="16" font-weight="700" fill="#1a1a1a">Parked is not automatically a problem</text>
  <text x="120" y="516" font-size="14" fill="#5e6680">Ask why a thread is parked before treating it as a bug.</text>
  <text x="120" y="544" font-size="14" fill="#5e6680">A thread pool waiting for requests at startup is expected - filter those threads out of the profile.</text>
  <text x="120" y="572" font-size="14" fill="#5e6680">Only chase parking that is unexpected: a lock that should be free, or I/O that should be fast.</text>

  <!-- footer -->
  <text x="640" y="680" font-size="13" fill="#1a1a1a" text-anchor="middle">Time in park()/parkNanos() is not automatically wasted time - most of it is threads waiting for work, not doing it.</text>

</svg>
