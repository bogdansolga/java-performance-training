# The app under test. Shipped at the step-1 baseline: NO resources block at all (BestEffort QoS,
# no memory protection). docs/kubernetes-lab-playbook.md walks through adding `resources` here at step 2
# and leaves it unchanged for steps 3 and 4 — only kubernetes/20-jvm-config.yaml changes after that.
#
# A cpu limit IS safe now. Earlier testing found that a 1-CPU limit crashed startup, because
# availableProcessors() returned 1 and SchedulingConfig's `/2` gave a pool size of 0. Both that
# and the matching pattern in PersistenceConfig are floored at 1, so requests == limits on both
# cpu and memory — which is what earns Guaranteed QoS.
#
# Probes use the actuator endpoints. They matter more than they look: without them the container
# reports Running even when the Spring context has failed, so a broken app looks healthy.
#
# Image is pulled from Docker Hub — bogdansolga/java-perf-training, untagged, so :latest, so
# imagePullPolicy defaults to Always and participants always get the current build.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: perf-lab
  labels:
    app: app
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: perf-lab
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: bogdansolga/java-perf-training
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: jvm-opts
          # No `resources:` block at step 1 — see header comment. Step 2 of the playbook adds:
          #
          # resources:
          #   requests:
          #     cpu: "1"
          #     memory: 1Gi
          #   limits:
          #     cpu: "1"
          #     memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
